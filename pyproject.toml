[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchlab"
version = "0.1.0"
description = "Single-camera pitching biomechanics, validated against marker-based motion capture"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Faizan Khan" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
stats = ["statsmodels>=0.14"]
sequence = ["torch>=2.1"]
video = ["mediapipe>=0.10.14", "opencv-python>=4.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pitchlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
